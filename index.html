<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ragnar’s Riddle Hashtag Shuffler</title>
  <style>
body {
  font-family: Arial, sans-serif;
  background: #0a0a0a;
  color: #e2e2e2;
  text-align: center;
  padding: 40px;
}

button {
  padding: 16px 24px;       /* bigger buttons */
  margin: 10px;
  font-size: 20px;          /* bigger text */
  cursor: pointer;
  background: #222;
  color: white;
  border: 1px solid #555;
  border-radius: 10px;
}

#output {
  margin-top: 30px;
  font-size: 36px;          /* larger for readability */
  font-weight: bold;
  word-wrap: break-word;
}

@media (max-width: 640px) {
  #output {
    font-size: 40px;        /* extra large on phones */
  }
  button {
    width: 100%;            /* stack buttons on mobile */
    font-size: 22px;
    padding: 18px 0;
  }
}
  </style>
</head>
<body>

<h1>🜁 Ragnar’s Riddle Hashtag Shuffler</h1>
<p>Generate a random hashtag from all 1014 riddles or a specific season.</p>

<button onclick="getRandomAll()">Random (All 1014)</button>
<button onclick="getRandomSeason()">Random (Choose Season)</button>

<div id="output"></div>

<script>
  function showTag(tag) {
  document.getElementById("output").innerHTML =
    `<a href="https://www.linkedin.com/feed/hashtag/${tag.slice(1)}/" target="_blank">${tag}</a>
     <br><button onclick="copyTag('${tag}')">Copy</button>`;
}

function copyTag(tag) {
  navigator.clipboard.writeText(tag).then(() => {
    alert(tag + " copied to clipboard! Paste into LinkedIn.");
  });
}
  const all = [];
  for (let i = 1; i <= 1014; i++) {
    all.push(`#RagnarsRiddles${i}`);
  }

  function getRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function getRandomAll() {
    const tag = getRandom(all);
    document.getElementById("output").innerHTML =
      `<a href="https://www.linkedin.com/feed/hashtag/${tag.slice(1)}/" target="_blank">${tag}</a>`;
  }

  function getRandomSeason() {
    const season = prompt("Enter season number (1–13):");
    if (!season || isNaN(season)) return;
    const s = parseInt(season);

    const start = (s - 1) * 78 + 1;
    const end = s * 78;

    if (start < 1 || end > 1014) {
      alert("Invalid season.");
      return;
    }

    const seasonList = [];
    for (let i = start; i <= end; i++) {
      seasonList.push(`#RagnarsRiddles${i}`);
    }

    const tag = getRandom(seasonList);
    document.getElementById("output").innerHTML =
      `<a href="https://www.linkedin.com/feed/hashtag/${tag.slice(1)}/" target="_blank">${tag}</a>`;
  }
</script>

</body>
</html>
